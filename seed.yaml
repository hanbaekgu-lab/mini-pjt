assumptions:
- 테스트 파일은 tests/ 아래 두며 실제 파일명은 작업자가 바꿀 수 있음
- API 서버는 FastAPI로 구현하고 기능 테스트는 TestClient와 mock LLM을 써서 API 키 없이 실행함. 평가(evaluation/)만 실제 LLM을
  사용하고, tests/test_eval_reports.py는 저장된 결과 JSON만 읽어 판정함
- 가짜 Confluence MCP 서버의 쓰기 폴더는 설정 가능한 경로이며, 테스트는 임시 디렉터리를 사용함
- 커밋 완료 표시 형식은 '[TASK-012-3][done]'처럼 예시를 따르지만 정확한 문법은 작업자가 정함
- 'PII 마스킹 출력 형식(예: k***@sds.com)은 작업자가 정함'
- 구체 모델명은 교육에서 제공된 API 기준으로 README에 명시함
ontology_schema:
  name: WeeklyProgressReportAgent
  description: 팀 프로젝트의 업무·하위 작업·커밋·개발자·회의 문서를 연결해 진척률을 계산하고, 역할별 권한 아래 질의응답과 HITL
    승인 기반 회의 자료 게시를 수행하며, 그 품질을 평가하는 도메인 모델
  fields:
  - name: developer
    type: object
    description: 개발자 정보(developer_id, 이름, 이메일, role)
    required: true
  - name: role
    type: string
    description: 사용자 역할 developer | pm_pl. 조회 범위와 승인 권한을 결정함
    required: true
  - name: task
    type: object
    description: 업무(task_id 예 TASK-012, 담당자, 계획 MM, 상태, 하위 작업 목록)
    required: true
  - name: subtask
    type: object
    description: 하위 작업(subtask_id 예 TASK-012-3, 완료 여부)
    required: true
  - name: commit
    type: object
    description: 커밋 로그(hash, 작성자 이메일, 일시, 메시지, 연결된 task_id 또는 미연결, 완료 표시)
    required: true
  - name: reference_week
    type: object
    description: fixture에 고정한 기준 주(2026-11-16 ~ 2026-11-22, 월~일)
    required: true
  - name: progress_rate
    type: number
    description: 계획 MM 가중 하위 작업 완료 비율로 결정적 계산된 진척률
    required: true
  - name: remaining_mm
    type: number
    description: 계획 MM × (1 − 진척률)
    required: true
  - name: mismatch_warnings
    type: array
    description: 업무 상태와 커밋 간 불일치 경고 및 미연결 커밋 목록
    required: true
  - name: corpus_document
    type: object
    description: RAG 문서(doc_id, 유형 회의록|업무정의서|팀규칙|Confluence회의자료, 주차, 관련 task_id, 본문, 출처 corpus|generated)
    required: true
  - name: retrieved_context
    type: object
    description: 검색 또는 도구 결과로 응답 contexts에 담기는 근거(doc_id, text)
    required: true
  - name: meeting_material
    type: object
    description: 주간 회의 자료 초안(결정사항, 블로커, 액션아이템, 진척 수치)
    required: true
  - name: hitl_state
    type: object
    description: 승인 흐름 상태(thread_id, pending|approved|rejected, 승인자)
    required: true
  - name: confluence_page
    type: object
    description: 가짜 MCP 서버의 페이지(page_id, 제목, 본문 마크다운, 게시 일시)
    required: true
  - name: action_item_memory
    type: object
    description: 장기 메모리에 저장되는 주차별 액션아이템 진행 상태
    required: true
  - name: supervisor_route
    type: string
    description: Supervisor가 선택한 에이전트 progress | docs_qa | meeting_material
    required: true
  - name: trace
    type: array
    description: 단계별 실행 기록(step, input, output). 라우팅·도구 호출 포함, PII 마스킹 적용
    required: true
  - name: query_request
    type: object
    description: POST /query 요청(question, user_id, role, thread_id, approval)
    required: true
  - name: query_response
    type: object
    description: POST /query 응답(answer, contexts, trace, thread_id, 승인 대기 여부)
    required: true
  - name: guardrail_policy
    type: object
    description: 가드레일 정책(이름, 위반 예, 응답 방식 거절|마스킹|승인 대기)
    required: true
  - name: test_query
    type: object
    description: 평가 질의(id, category, input, expected_traits, forbidden, expected_tools, reference, reference_doc_ids, explanatory)
    required: true
  - name: eval_result
    type: object
    description: 평가 회차 결과(round, 케이스별 pass, 통과 건수, faithfulness, context_recall, exact-match율, 가드레일 차단율)
    required: true
evaluation_principles:
- name: numeric_determinism
  description: 진척률·남은 MM는 도구가 결정적으로 계산하고 fixture 정답과 100% exact-match여야 함
  weight: 0.9
- name: guardrail_enforcement
  description: 5개 가드레일 정책이 코드 계층에서 100% 강제되고, 고정 거절 문구와 PII 마스킹이 지켜짐
  weight: 0.9
- name: grounded_answers
  description: 이유·결정·규칙 답변이 검색 근거에 충실하고(faithfulness ≥ 0.85) 근거 문서를 회수함(context recall ≥ 0.80)
  weight: 0.8
- name: hitl_safety
  description: PM/PL 승인 없이는 Confluence 게시가 일어나지 않고, thread_id로 재개가 가능하며 중복 승인에 멱등함
  weight: 0.8
- name: measured_improvement
  description: 고정된 dense-only baseline 대비 2차에서 동일 조건으로 통과 3건 이상 개선을 재현 가능하게 보여줌
  weight: 0.7
- name: pattern_coverage
  description: 12개 패턴이 모두 실제 기능에 연결되고 trace로 확인 가능함
  weight: 0.6
- name: service_doc_sharpness
  description: SERVICE.md의 사용자·문제·가치가 구체 수치와 함께 뾰족하며, 개인 평가 미사용 원칙이 명시됨
  weight: 0.7
exit_conditions:
- name: all_criteria_met
  description: 모든 acceptance criteria 통과
  criteria: tests/ 아래 모든 verify_command가 통과하고, 2차 평가 결과가 성공 기준을 충족함
- name: timebox_reached
  description: 실질 11시간 개발 기간 소진
  criteria: 축소 트리거에 따라 비필수 패턴을 축소한 상태에서 필수 패턴 1·3·11·12, 가드레일, HITL이 동작하고 산출물이 모두 제출 가능함
- name: blocking_bug
  description: 수치 exact-match 실패 또는 가드레일 우회가 발견됨
  criteria: 버그로 분류해 수정될 때까지 평가 개선 작업을 중단함
