<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5}
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .f{font-size:11.5px;fill:#64748b;font-family:Consolas,'D2Coding',monospace}
      .s{font-size:12px;fill:#334155}
      .b{font-size:12px;fill:#0f172a;font-weight:700}
      .p{font-size:11px;font-weight:700;fill:#ffffff}
      .lb{font-size:11px;fill:#475569}
      .ln{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#arr)}
      .lg{stroke:#b45309;stroke-width:1.6;fill:none;stroke-dasharray:6 4;marker-end:url(#arrG)}
      .lr{stroke:#0f766e;stroke-width:1.6;fill:none;stroke-dasharray:6 4;marker-end:url(#arrB)}
    </style>
  </defs>

  <rect width="1280" height="900" fill="#f8fafc"/>
  <text x="40" y="44" font-size="24" font-weight="800" fill="#0f172a">주간 진척 보고 에이전트 · 아키텍처</text>
  <text x="40" y="70" class="s">커밋으로 진척을 계산하고, 문서 근거로 답하며, PM/PL이 승인하면 Confluence에 주간 회의 자료를 등록합니다. 원 안 숫자 = 활용한 패턴 번호(README)</text>

  <!-- ===== 1행: 요청 경로 ===== -->
  <!-- 사용자 -->
  <rect x="40" y="100" width="190" height="128" rx="10" class="box"/>
  <text x="56" y="126" class="t">사용자</text>
  <text x="56" y="146" class="s">PM · PL · 개발자</text>
  <text x="56" y="168" class="f">POST /login {user_id}</text>
  <text x="56" y="186" class="f">→ session_token</text>
  <text x="56" y="206" class="f">POST /query (+/stream)</text>
  <text x="56" y="222" class="f">Bearer + 본문 {"question"}</text>

  <!-- API · 세션 -->
  <rect x="270" y="100" width="220" height="128" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="286" y="126" class="t">API · 로그인 세션</text>
  <text x="286" y="146" class="f">api.py (FastAPI)</text>
  <text x="286" y="168" class="s">신원(user_id·역할·파트)은 세션에서</text>
  <text x="286" y="186" class="s">토큰 없음·무효 → 401</text>
  <text x="286" y="204" class="s">남의 thread → 404 · 본문 신원 → 422</text>

  <!-- 가드레일 -->
  <rect x="530" y="100" width="240" height="128" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="546" y="126" class="t">가드레일</text>
  <text x="546" y="146" class="f">guardrails.py</text>
  <text x="546" y="168" class="s">범위: PM 전체·PL 본인 파트·개발자 본인</text>
  <text x="546" y="186" class="s">인젝션·사람 순위: 정규식 → LLM 분류기</text>
  <text x="546" y="204" class="s">라우팅·도구 실행 전에 코드로 검사</text>
  <circle cx="750" cy="118" r="11" fill="#f97316"/><text x="750" y="122" text-anchor="middle" class="p">6</text>

  <!-- Supervisor -->
  <rect x="800" y="100" width="210" height="128" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="816" y="126" class="t">Supervisor</text>
  <text x="816" y="146" class="f">supervisor.py</text>
  <text x="816" y="168" class="s">구조화 출력 LLM 라우터</text>
  <text x="816" y="186" class="s">요청당 1회 · 다중 의도: 진척+문서</text>
  <text x="816" y="204" class="s">→ 진척 / 문서 Q&amp;A / 회의 자료</text>
  <circle cx="966" cy="118" r="11" fill="#6366f1"/><text x="966" y="122" text-anchor="middle" class="p">9</text>
  <circle cx="990" cy="118" r="11" fill="#6366f1"/><text x="990" y="122" text-anchor="middle" class="p">1</text>

  <!-- Bedrock -->
  <rect x="1050" y="100" width="190" height="128" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="1066" y="126" class="t">AWS Bedrock</text>
  <text x="1066" y="146" class="f">config.py (리전: .env)</text>
  <text x="1066" y="168" class="s">Claude Sonnet 4.5 · temp 0</text>
  <text x="1066" y="186" class="s">Titan Embeddings v2</text>
  <text x="1066" y="204" class="s">타임아웃 120초 · 재시도 3회</text>
  <text x="1066" y="220" class="lb">에이전트·라우터·채점 공용</text>

  <line x1="230" y1="164" x2="266" y2="164" class="ln"/>
  <line x1="490" y1="164" x2="526" y2="164" class="ln"/>
  <line x1="770" y1="164" x2="796" y2="164" class="ln"/>

  <!-- Supervisor → 세 에이전트 -->
  <path d="M905,228 L905,250 L230,250 L230,282" class="ln"/>
  <path d="M905,250 L640,250 L640,282" class="ln"/>
  <path d="M905,228 L905,250 L1050,250 L1050,282" class="ln"/>
  <text x="250" y="244" class="lb">진척</text>
  <text x="660" y="244" class="lb">문서 Q&amp;A</text>
  <text x="1070" y="244" class="lb">회의 자료</text>

  <!-- ===== 2행: 에이전트 ===== -->
  <!-- 진척 ReAct -->
  <rect x="40" y="286" width="380" height="300" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="56" y="312" class="t">① 진척 에이전트 (ReAct)</text>
  <text x="56" y="332" class="f">agent.py · create_agent + 도구</text>
  <text x="56" y="356" class="b">숫자는 도구가 결정적으로 계산 (tools.py)</text>
  <text x="56" y="378" class="s">· calc_progress  계획 MM 가중 진척률·계획 대비 차이</text>
  <text x="56" y="398" class="s">· calc_remaining_mm  남은 MM</text>
  <text x="56" y="418" class="s">· check_mismatch  상태-커밋 불일치 경고</text>
  <text x="56" y="438" class="s">· get_commits  [SCR-ID] 매핑 · 미연결 커밋</text>
  <text x="56" y="462" class="s">도구는 요청자 범위로 고정 · 이름→ID 변환 후 범위 검사</text>
  <text x="56" y="482" class="s">질문마다 도구 재호출 · 결과를 답변 끝에 그대로 첨부</text>
  <text x="56" y="502" class="s">대화 요약 · 모델 재시도 미들웨어</text>
  <rect x="56" y="520" width="348" height="50" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="68" y="541" class="f">data/fixtures/</text>
  <text x="68" y="560" class="s">화면 170개 · 커밋 · 개발자 · 프로젝트 일정</text>
  <circle cx="376" cy="304" r="11" fill="#16a34a"/><text x="376" y="308" text-anchor="middle" class="p">2</text>
  <circle cx="400" cy="304" r="11" fill="#16a34a"/><text x="400" y="308" text-anchor="middle" class="p">4</text>

  <!-- 문서 Q&A -->
  <rect x="450" y="286" width="380" height="300" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="466" y="312" class="t">② 문서 Q&amp;A (RAG)</text>
  <text x="466" y="332" class="f">retriever.py · agent.py (LCEL)</text>
  <text x="466" y="356" class="b">1차 baseline: Titan 벡터 검색만 (top-3)</text>
  <text x="466" y="378" class="b">2차 레버:</text>
  <text x="466" y="398" class="s">· 형태소(kiwipiepy) BM25 + 벡터 RRF · 리랭킹</text>
  <text x="466" y="418" class="s">· 쿼리 확장 · 주차/화면 ID 필터 · 기준 주 안내</text>
  <text x="466" y="438" class="s">· 이력 요약 질문은 회의록 우선 5건</text>
  <text x="466" y="458" class="s">· 근거 인용 · "문서에 없으면 모른다"</text>
  <text x="466" y="482" class="s">간접 인젝션 줄 제외 · 범위 밖 수치 가림</text>
  <text x="466" y="502" class="s">긴 문서는 3,000자 조각 임베딩(Titan 한도)</text>
  <rect x="466" y="520" width="348" height="50" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="478" y="541" class="f">data/corpus/ + 게시된 회의 자료(런타임)</text>
  <text x="478" y="560" class="s">회의록 · 화면 정의서 · 팀 규칙 · 계획</text>
  <circle cx="810" cy="304" r="11" fill="#2563eb"/><text x="810" y="308" text-anchor="middle" class="p">3</text>

  <!-- 회의 자료 -->
  <rect x="860" y="286" width="380" height="300" rx="10" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="876" y="312" class="t">③ 회의 자료 (Plan-Execute)</text>
  <text x="876" y="332" class="f">meeting.py · LangGraph StateGraph</text>
  <text x="876" y="356" class="s">1. 계획 (LLM 계획 → 고정 단계로 검증)</text>
  <text x="876" y="376" class="s">2. 진척 수집 (①의 결정적 계산)</text>
  <text x="876" y="396" class="s">3. 지난주 회의 확인 (MCP get_page · 스냅샷)</text>
  <text x="876" y="416" class="s">4. 초안 (구조화 출력) · 단계 실패 시 Replan</text>
  <text x="876" y="436" class="b">5. interrupt() → PM/PL 승인 대기</text>
  <text x="876" y="456" class="s">6. 승인 시 게시 · 이번 주 스냅샷 저장</text>
  <text x="876" y="482" class="s">업무 단위만 (개인 이름·진척률 없음)</text>
  <text x="876" y="502" class="s">일정 대비 진척 · 지난주 대비 ▲▼ · 이슈 추적</text>
  <rect x="876" y="520" width="348" height="50" rx="8" fill="#ffffff" stroke="#f0abfc"/>
  <text x="888" y="541" class="b">HITL: 응답에 thread_id + pending_approval</text>
  <text x="888" y="560" class="s">approval=approve|reject|edit (고쳐서 승인)</text>
  <circle cx="1172" cy="304" r="11" fill="#a21caf"/><text x="1172" y="308" text-anchor="middle" class="p">10</text>
  <circle cx="1196" cy="304" r="11" fill="#a21caf"/><text x="1196" y="308" text-anchor="middle" class="p">7</text>
  <circle cx="1220" cy="304" r="11" fill="#a21caf"/><text x="1220" y="308" text-anchor="middle" class="p">1</text>

  <!-- ①→③ 진척 수집 -->
  <path d="M330,286 L330,268 L960,268 L960,282" class="lg"/>
  <text x="440" y="264" class="lb" fill="#b45309">진척 계산 재사용 (회의 자료 2단계)</text>

  <!-- ===== 3행: 공용 구성 ===== -->
  <!-- 미들웨어·메모리 -->
  <rect x="40" y="620" width="590" height="96" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="56" y="646" class="t">미들웨어 · 메모리</text>
  <text x="56" y="666" class="f">middleware.py · state.py (STATE_DB면 SQLite 영구 저장)</text>
  <text x="56" y="688" class="s">출력 단계 PII 마스킹(answer·contexts·trace·게시물) · 타임아웃 · 재시도(게시는 1회만)</text>
  <text x="56" y="706" class="s">승인 대기·thread 기록·회의 스냅샷(장기 메모리) · LLM 사용량 집계</text>
  <circle cx="586" cy="638" r="11" fill="#ca8a04"/><text x="586" y="642" text-anchor="middle" class="p">8</text>
  <circle cx="610" cy="638" r="11" fill="#ca8a04"/><text x="610" y="642" text-anchor="middle" class="p">10</text>

  <!-- Confluence MCP -->
  <rect x="660" y="620" width="580" height="96" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="676" y="646" class="t">Confluence (MCP)</text>
  <text x="676" y="666" class="f">mcp_confluence_server.py (fastmcp, stdio) ↔ mcp_client.py (langchain-mcp-adapters)</text>
  <text x="676" y="688" class="s">tool get_page·create_page·search_pages · resource·prompt · Markdown 변환기</text>
  <text x="676" y="706" class="s">CONFLUENCE_MODE=fake(로컬 .md·.storage.xml) | real(REST, .env 주소·인증)</text>
  <circle cx="1220" cy="638" r="11" fill="#0f766e"/><text x="1220" y="642" text-anchor="middle" class="p">5</text>

  <path d="M1050,586 L1050,616" class="lr"/>
  <text x="1058" y="606" class="lb" fill="#0f766e">게시 · 지난주 조회</text>
  <path d="M800,620 L800,600 L700,600 L700,590" class="lr"/>
  <text x="810" y="604" class="lb" fill="#0f766e">게시물 → 런타임 검색 (평가 제외)</text>

  <!-- ===== 4행: 관측·평가 ===== -->
  <rect x="40" y="748" width="590" height="110" rx="10" class="box"/>
  <text x="56" y="774" class="t">Trace</text>
  <text x="56" y="794" class="f">tracing.py</text>
  <text x="56" y="816" class="s">trace: 가드레일 → 라우팅 → 도구 → 승인·게시 → llm_usage (SSE로 실시간 진행)</text>
  <text x="56" y="836" class="s">LANGSMITH_API_KEY 있으면 LangSmith, 없으면 logs/trace/ JSON</text>
  <circle cx="610" cy="766" r="11" fill="#475569"/><text x="610" y="770" text-anchor="middle" class="p">11</text>

  <rect x="660" y="748" width="580" height="110" rx="10" class="box"/>
  <text x="676" y="774" class="t">평가 (RAGAS · LLM-as-Judge)</text>
  <text x="676" y="794" class="f">evaluation/run_eval.py · test_queries.csv 20건 × 3회</text>
  <text x="676" y="816" class="s">1차 dense-only baseline → 2차 개선 레버 · 로그인 세션으로 질의</text>
  <text x="676" y="836" class="s">faithfulness · context recall/precision · answer relevancy + 수치·가드레일 검사</text>
  <circle cx="1220" cy="766" r="11" fill="#475569"/><text x="1220" y="770" text-anchor="middle" class="p">12</text>
</svg>
