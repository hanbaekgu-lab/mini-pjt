goal: AX 교육 개인 mini PJT로 '주간 진척 보고 에이전트'를 만든다. 예시 도메인은 1년짜리 플랫폼 전환 프로젝트(화면 170개,
  팀 10명 = PM 1·PL 2·개발자 7)이며, 화면별 4단계(분석·개발·단위테스트·통합테스트) 진척률을 가짜 git 커밋 로그 기반으로 자동
  산정한다. PM에게는 전체 현황, PL에게는 본인 파트 현황을 주고, 주간회의 자료 초안은 PM 또는 PL의 HITL 승인 후 Confluence(가짜
  MCP 서버)에 게시한다. 개발자에게는 본인 화면 진척률, 남은 화면·단계, 남은 MM를 알려준다. 회의록·화면 정의서·팀 규칙·전환 일정·과거
  회의 자료를 검색해 이유·결정·규칙 질문에 답하는 Agentic RAG 어시스턴트로 구성하며, 12개 패턴을 모두 적용한다.
task_type: code
brownfield_context:
  project_type: greenfield
  context_references: []
  existing_patterns: []
  existing_dependencies: []
constraints:
# --- 범위·일정 ---
- 교육에서 배운 12개 패턴(1 LCEL+Pydantic, 2 ReAct bind_tools, 3 RAG, 4 다중 도구, 5 MCP, 6 가드레일, 7 HITL
  interrupt, 8 미들웨어, 9 Multi-Agent Supervisor, 10 Plan-Execute·장기 메모리, 11 Observability/Trace,
  12 RAGAS·LLM-as-Judge)을 모두 포함해야 함
- 개발 timebox는 실질 11시간(개발일 09~18시 8시간 + 마감일 09~12시 3시간)임
- 필수 패턴 1·3·11·12와 가드레일, HITL은 시간이 부족해도 축소하지 않음
- '축소 트리거: 마감일 09:00 시점에 test_progress·test_guardrails·test_api가 모두 통과하지 않았으면 아래 순서로 한 단계씩 축소함:
  (1) Plan-Execute→고정 순차 체인, (2) 장기 메모리 LangGraph Store→JSON 파일, (3) Supervisor 3개→2개 에이전트(문서 Q&A와 회의 자료
  에이전트 통합), (4) 미들웨어의 대화 요약 제외. 축소한 내역은 README에 기록함'
- '산출물: src/agent.py, src/tools.py, src/retriever.py, data/, POST /query API, SERVICE.md,
  evaluation/test_queries.csv, evaluation/round1_report.md, evaluation/round2_report.md, README.md'
- '저장소 루트에는 README.md, SERVICE.md, requirements.txt, pytest.ini, .env.example, .gitignore, Dockerfile, run.sh(+ .dockerignore)와
  src/, data/, evaluation/, tests/, docs/만 둠. 명세(seed.yaml·인터뷰 요약)는 docs/spec/, 강의 자료는 docs/course/(git 제외),
  아키텍처·사용 예시 이미지는 docs/images/에 둠'
- 'Dockerfile은 python:3.14-slim 기반으로 requirements를 설치하고 8000 포트에서 uvicorn src.server:app을 실행하며 비밀 정보를 이미지에 넣지 않음
  (.dockerignore가 .env·.venv·logs·.git·data/generated·docs/course 제외, 실행 시 docker run --env-file .env로 주입). run.sh는 setup·server·test·
  eval N·rescore N·fixtures·docker-build·docker-run 하위 명령을 제공하고 Windows Git Bash에서도 동작함(.venv/Scripts와 .venv/bin 자동 판별)'
- 모든 데이터는 가짜 데이터(fixture)로 구성함. 실제 git 저장소 연동은 범위 밖
- '가짜 데이터의 인물·이메일은 실존 인물로 오해되지 않게 둠: 이름은 한글 성 + 축구선수 이름 두 글자(예: 김메시), 이메일 도메인은 example.com'
- 'AWS 리전 등 환경별 값은 코드·문서에 실제 값을 적지 않고 .env(AWS_DEFAULT_REGION 등)에서만 읽음'
- public repo에 인증 정보를 포함하지 않음
# --- API ---
- 'POST /query 요청 본문은 표준 규약 {"question"}이고 확장 필드는 선택(thread_id: 대화·HITL 재개, approval: approve|reject)임.
  응답은 answer, contexts, trace(+ thread_id, pending_approval)를 반환함'
- '신원은 로그인 세션으로 받음: POST /login {"user_id"} → {"session_token", "name", "role", "part"}(SSO(OIDC 등) 자리에 들어갈 데모 로그인,
  비밀번호 없음, developers.json 등록 사용자만, 토큰은 서버 메모리 uuid4 hex). /query는 Authorization: Bearer <session_token> 헤더에서
  사용자를 정하고 역할은 서버가 등록 정보로 정함(클라이언트는 role을 보내지 않음)'
- 'API 오류 규칙: 미등록 user_id 로그인·토큰 없음·무효 토큰은 HTTP 401, approval 값 오류와 본문의 user_id·role 등 정의되지 않은 필드는
  HTTP 422(''로그인 세션 사용'' 안내, 무시하지 않음), 존재하지 않거나 다른 사용자 소유의 thread_id는 HTTP 404. 이미 처리된 thread_id에
  approval을 다시 보내면 상태를 바꾸지 않고 기존 결과를 그대로 반환함(멱등)'
- 'thread 소유권: thread는 만든 세션 사용자만 이어 씀(다른 사용자는 404). 예외로 승인 대기 회의 자료는 PM·PL 누구나 승인·반려할 수 있고,
  승인·반려·거절 응답에는 contexts·초안을 싣지 않고 게시 결과와 최소 trace만 담음. 같은 thread_id에 approval 없이 새 질문을 보내면 새로 답하고,
  진척 에이전트 대화 기억은 thread_id별로 이어 씀'
- '처리 순서: 세션 확인 → thread 소유권 → 가드레일 → Supervisor 라우팅(요청당 1회, 캐시 없음) → 담당 에이전트. 가드레일에 막힌 요청은
  라우팅(LLM)하지 않으며 trace는 guardrail → supervisor_route → ... 순서임'
- 'MCP 호출은 내부 대기 10초 < 바깥 타임아웃 15초이고 create_page는 한 번만 시도함(중복 게시 방지). 재시도는 최대 1회이며 타임아웃은
  재시도하지 않고, 타임아웃이 난 thread는 다음 요청부터 새 대화 기억 키를 씀. LLM 미들웨어 재시도도 1회'
- 사용자 식별은 인증 없는 데모 로그인 수준이며 실제 SSO 연동은 범위 밖임(자연어로 역할을 주장하는 시도는 가드레일 대상)
# --- 도메인 ---
- '프로젝트는 플랫폼 전환 프로젝트(2026-03-02 ~ 2027-02-26, 12개월)이며 data/fixtures/project.json에 이름·기간·기준 주·파트별 대메뉴를 둠'
- '메뉴 구조는 대메뉴 8개(코드 A~H) → 중메뉴 34개(코드 A01..) → 소메뉴 화면 정확히 170개이고, 화면 ID는 메뉴 코드를 따름(SCR-A01-03 =
  대메뉴 A·중메뉴 01·소메뉴 03). 화면 1개가 업무 1개이며 screen_id, 화면명, 대·중메뉴 코드·이름, 담당자, 계획 MM, 상태(완료|진행중|미착수),
  계획 시작일·계획 종료일을 가짐'
- 모든 화면은 단계 4개(1 분석, 2 개발, 3 단위테스트, 4 통합테스트)로 고정함
- '팀은 10명: PM 1(pm01), PL 2(pl01은 대메뉴 A~D와 개발자 4명, pl02는 대메뉴 E~H와 개발자 3명), 개발자 7(dev01~dev07).
  developers.json에 role(pm|pl|developer)·part(PL1|PL2|null)·lead를 둠'
- fixture는 고정 시드 생성기(data/fixtures/make_fixtures.py)로 만들고, 정답(expected_progress.json)은 생성기가 의도한 단계 완료 상태로 따로 계산함
# --- 진척 계산 ---
- '커밋-화면 매핑 키는 커밋 메시지의 화면 ID(형식 SCR-[A-Z]\d{2}-\d{2})임. 단계 완료는 [SCR-A01-03-2][done] 형식. ID가 없거나 형식이
  틀리거나 없는 화면 ID인 커밋은 ''미연결''로 별도 표시함'
- 개발자 식별은 커밋 작성자 이메일을 개발자 정보와 연결해서 함. 실제 이메일 값으로 내부 처리하고 마스킹은 출력 단계에서만 적용함
- 화면 진척률은 완료 단계 / 4이고, 대메뉴·중메뉴·파트·개발자·전체 진척률은 화면별 계획 MM으로 가중해 계산함. 단계 완료는 커밋 메시지의
  완료 표시로 판정하고, 커밋 수는 진척률에 넣지 않고 근거로만 표시함
- 계획 대비 지연 화면은 계획 종료일이 기준 주 종료일보다 앞인데 상태가 '완료'가 아닌 화면임
- '일정 대비 진척: 일정 경과율 = 프로젝트 시작일~기준 주 종료일 일수 / 전체 일수(양 끝 포함), 계획 진척률 = 화면별 계획 시작~종료일
  선형 비율(0~1)의 계획 MM 가중, 차이(%p) = 실적 - 계획, 상태 = 차이 -3%p 이상 정상·-10%p 이상 주의·그 미만 지연. 전체·파트·대메뉴·중메뉴에 적용함'
- '지난주 회의 스냅샷(data/fixtures/meeting_history.json, 2026-11-09 주)은 생성기가 2026-11-15까지의 커밋으로 상태를 되돌려 결정적으로 만들고
  (진척은 이번 주보다 작거나 같음), 진척·계획 진척·메뉴별·단계별 완료 수·이슈(안정 ID)·액션아이템을 담음. 정답 expected_progress.json에도 지난주 값과
  이슈 해결·지속·신규 분류, 지난주 액션아이템 이행 여부를 둠'
- '이슈는 안정 ID로 회의 간 추적함: DLY-<화면>(계획 대비 지연), MIS-<화면>(상태-커밋 불일치), UNL-<커밋>(미연결 커밋). 지난주에만 있으면 해결,
  둘 다 있으면 미해결(처음 발생 주부터 지속 N주), 이번 주에만 있으면 신규. 지난주 액션아이템 이행은 데이터로 판단함(단계 ID는 그 단계 완료 표시,
  화면 ID만 있으면 상태 완료, 커밋 해시는 미연결 해소)'
- 남은 MM = 계획 MM × (1 − 진척률). 진척률·MM 등 숫자는 도구(함수)가 결정적으로 계산하고 LLM은 설명만 함
- '''이번 주''는 실제 현재 날짜가 아니라 fixture에 고정한 기준 주(2026-11-16 월 ~ 2026-11-22 일)로 계산함'
- 화면 상태와 커밋이 불일치하면 상태를 우선하고 불일치는 경고로 표시함
# --- RAG·코퍼스 ---
- RAG는 수치가 아닌 이유·결정·규칙 질문을 담당함
- '평가용 코퍼스는 data/corpus/에 고정 스냅샷으로 둠: 한국어 가짜 문서 15~20건(주간회의록 4~6주(결정사항/블로커/액션아이템 섹션
  고정), 번호 매긴 완료 조건이 있는 화면 정의서(SCR-DEF-*), 팀 규칙(커밋 규칙·MM 산정 가이드·회의록 템플릿·단계 정의), 전환 일정). 간접 인젝션 테스트용으로 숨은 지시가
  담긴 회의록 1건을 포함함'
- 에이전트가 게시한 회의 자료는 data/generated/에 저장하고 런타임 검색 인덱스에만 추가하며 평가 시에는 제외함. 같은 페이지를 다시 게시하면
  인덱스의 이전 버전을 교체하고 중복 추가하지 않음
- PM 외 역할의 RAG 답변에서는 범위 밖 사람(개발자는 본인 외, PL은 본인 파트 외)의 진척 수치를 제외하고, 결정사항·블로커 등 팀 공용 내용만 보여줌
- '화면 정의서·팀 규칙·전환 일정·회의록·게시된 회의 자료는 팀 공용 문서라 모든 역할이 읽을 수 있음. 역할 범위는 개인 진척·사람 정보에만 적용함:
  범위 밖 화면이라도 정의서 내용(완료 조건·기능 등)만 묻는 질문은 문서 Q&A로 답하고, 그 화면의 진척·담당·지연·완료 여부 질문은 거절함'
# --- 가드레일 ---
- '가드레일 1: 역할별 조회 범위(PM은 전체, PL은 본인 파트의 대메뉴·소속 개발자, 개발자는 본인 화면만, RAG 경로 포함). 신원(user_id·role)은 질문 문구가 아니라 세션에서만
  정하며, ''나는 PL인데'' 같은 자기 소개 문구만으로는 거절하지 않음. 세션 신원의 범위 밖 데이터 요청은 거절하고 거절 문구는 ''해당 정보는
  조회 권한이 없습니다''로 고정해 대상자 존재 여부를 드러내지 않음. 요청 role이 등록된 사용자 역할과 다르면 API가 403으로 거절함'
- 개인 진척은 관리자가 요청할 때만 조회함(PM은 누구든, PL은 본인 파트 구성원, 개발자는 본인만)
- '가드레일 2: 이메일·전화번호 PII는 모든 역할의 최종 답변, trace, Confluence 게시물에서 마스킹함. 마스킹은 미들웨어 한 곳에서만 처리함'
- '가드레일 3: 질문 속 직접 프롬프트 인젝션은 거절함. 검색 문서 속 간접 인젝션은 해당 청크만 제외하고 원 질문에 답함. 시스템 프롬프트는
  노출하지 않음'
- '가드레일 4: 승인 없는 Confluence 게시를 금지함. 초안을 보여주고 승인 대기(HITL)하며 PM과 PL만 승인할 수 있음(개발자 불가)'
- '가드레일 5: 사람 평가·순위 매기기는 모든 역할에서 거절하고 업무 단위 현황으로 대체 안내함'
- 권한 체크는 프롬프트가 아니라 도구 실행 전 코드 계층에서 강제함
# --- 패턴 구현 ---
- Confluence 연동은 기본적으로 가짜 MCP 서버(stdio, 설정 가능한 로컬 폴더에 마크다운 쓰기)이며 tool 스키마는 get_page,
  create_page, search_pages임. 실제 API는 CONFLUENCE_MODE=real일 때만 쓰는 어댑터로 분리함
- 'MCP는 직접 구현한 JSON-RPC 대신 공식 SDK 계열을 씀: 서버는 fastmcp(2.13.0, mcp 1.30.0), 클라이언트는 langchain-mcp-adapters(0.3.2)
  MultiServerMCPClient stdio. 나머지 코드는 동기 call_tool(name, arguments) 호출면을 그대로 쓰고(내부에서 비동기 세션을 열고 닫음),
  10초 타임아웃·재시도 미들웨어를 유지함'
- '실제 Confluence 전환을 전제로 접속 정보는 .env의 CONFLUENCE_BASE_URL, CONFLUENCE_SPACE_KEY, CONFLUENCE_PARENT_PAGE_ID,
  CONFLUENCE_USER, CONFLUENCE_API_TOKEN으로만 받음. 저장소에는 mock 값을 담은 .env.example만 두고, real 모드에서 값이 빠지면
  변수 이름만 알리는 오류를 냄(값은 출력하지 않음)'
